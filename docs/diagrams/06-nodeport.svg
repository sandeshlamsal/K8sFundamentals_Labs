<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 904 354" width="904" height="354" role="img" aria-label="A client hits port 30080 on worker1, which has no api pod; worker1 rewrites destination and source and forwards to the pod on worker2, so the pod no longer sees the client's IP. With externalTrafficPolicy Local the client goes straight to worker2 and its IP is kept.">
<style>
  :root{--panel:#ffffff;--fg:#152033;--muted:#5b6b82;--line:#b9c4d4;--node:#e6ecf5;--pod:#dbe7ff;--pod-line:#6f93e0;--accent:#2a56c6;--pkt:#c2570c;--pkt-fill:#fdebd8}
  @media (prefers-color-scheme: dark){:root{--panel:#161e29;--fg:#e3e9f2;--muted:#93a1b5;--line:#3a4759;--node:#1a2431;--pod:#1c2f57;--pod-line:#5c82d6;--accent:#86a9ff;--pkt:#f0a253;--pkt-fill:#3a2714}}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:var(--fg)}
  .b{font-weight:600} text.dim{fill:var(--muted)} text.p{fill:var(--pkt);font-weight:600} text.a{fill:var(--accent);font-weight:600}
  .bg{fill:var(--panel)} .node{fill:var(--node);stroke:var(--line)} .pod{fill:var(--pod);stroke:var(--pod-line)}
  .box{fill:var(--panel);stroke:var(--line)} .hot{fill:var(--pkt-fill);stroke:var(--pkt);stroke-width:1.5}
  .ln{fill:none;stroke:var(--muted);stroke-width:1.5} .ln.a{stroke:var(--accent);stroke-width:2}
  .ln.p{stroke:var(--pkt);stroke-width:2} .ln.dash{stroke-dasharray:5 4}
  .mk{fill:var(--muted)} .mk.a{fill:var(--accent)} .mk.p{fill:var(--pkt)}
</style>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk a" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk p" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="-12" y="-12" width="904" height="354" rx="6"/>
      <rect class="box" x="10" y="135" width="150" height="60" rx="4"/>
      <text class="b" x="85" y="160" text-anchor="middle">client</text><text x="85" y="180" text-anchor="middle">172.18.0.9</text>
      <rect class="node" x="330" y="20" width="300" height="120" rx="6"/>
      <text class="b" x="346" y="44">worker1 172.18.0.3</text>
      <text class="dim" x="346" y="68">:30080 open, no api pod here</text>
      <text x="346" y="96">DNAT dst → 10.244.2.7:8080</text>
      <text x="346" y="118">SNAT src → 172.18.0.3</text>
      <rect class="node" x="330" y="190" width="300" height="120" rx="6"/>
      <text class="b" x="346" y="214">worker2 172.18.0.4</text>
      <rect class="pod" x="350" y="236" width="180" height="56" rx="4"/>
      <text class="b" x="440" y="260" text-anchor="middle">api</text><text x="440" y="278" text-anchor="middle">10.244.2.7:8080</text>
      <line class="ln p" x1="160" y1="150" x2="328" y2="84" marker-end="url(#mp)"/>
      <text class="p" x="120" y="92">dst 172.18.0.3:30080</text>
      <line class="ln p" x1="500" y1="140" x2="500" y2="234" marker-end="url(#mp)"/>
      <text class="p" x="512" y="170">extra hop</text>
      <text x="650" y="258">pod sees src 172.18.0.3,</text>
      <text x="650" y="276">not the client</text>
      <line class="ln a dash" x1="160" y1="180" x2="348" y2="262" marker-end="url(#ma)"/>
      <text class="a" x="10" y="322">externalTrafficPolicy: Local → straight in, client IP kept</text>
    </svg>
