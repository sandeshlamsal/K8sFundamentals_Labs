<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 904 324" width="904" height="324" role="img" aria-label="Pod A sends to the Service IP; iptables rules on its own node rewrite the destination to one of three backing pod IPs, here api-2.">
<style>
  :root{--panel:#ffffff;--fg:#152033;--muted:#5b6b82;--line:#b9c4d4;--node:#e6ecf5;--pod:#dbe7ff;--pod-line:#6f93e0;--accent:#2a56c6;--pkt:#c2570c;--pkt-fill:#fdebd8}
  @media (prefers-color-scheme: dark){:root{--panel:#161e29;--fg:#e3e9f2;--muted:#93a1b5;--line:#3a4759;--node:#1a2431;--pod:#1c2f57;--pod-line:#5c82d6;--accent:#86a9ff;--pkt:#f0a253;--pkt-fill:#3a2714}}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:var(--fg)}
  .b{font-weight:600} text.dim{fill:var(--muted)} text.p{fill:var(--pkt);font-weight:600} text.a{fill:var(--accent);font-weight:600}
  .bg{fill:var(--panel)} .node{fill:var(--node);stroke:var(--line)} .pod{fill:var(--pod);stroke:var(--pod-line)}
  .box{fill:var(--panel);stroke:var(--line)} .hot{fill:var(--pkt-fill);stroke:var(--pkt);stroke-width:1.5}
  .ln{fill:none;stroke:var(--muted);stroke-width:1.5} .ln.a{stroke:var(--accent);stroke-width:2}
  .ln.p{stroke:var(--pkt);stroke-width:2} .ln.dash{stroke-dasharray:5 4}
  .mk{fill:var(--muted)} .mk.a{fill:var(--accent)} .mk.p{fill:var(--pkt)}
</style>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk a" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk p" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="-12" y="-12" width="904" height="324" rx="6"/>
      <rect class="pod" x="10" y="115" width="140" height="70" rx="4"/>
      <text class="b" x="80" y="144" text-anchor="middle">pod A</text><text x="80" y="164" text-anchor="middle">10.244.1.5</text>
      <line class="ln p" x1="150" y1="150" x2="298" y2="150" marker-end="url(#mp)"/>
      <text class="p" x="225" y="140" text-anchor="middle">dst 10.96.0.50:80</text>
      <text class="dim" x="225" y="170" text-anchor="middle">the Service IP</text>
      <rect class="node" x="300" y="30" width="250" height="240" rx="6"/>
      <text class="b" x="316" y="56">iptables on worker1</text>
      <text class="dim" x="316" y="74">written by kube-proxy</text>
      <text x="316" y="112">1 match dst 10.96.0.50:80</text>
      <text x="316" y="142">2 pick 1 of 3 endpoints</text>
      <text x="316" y="172">3 DNAT → 10.244.2.7:8080</text>
      <text class="dim" x="316" y="222">conntrack remembers the</text>
      <text class="dim" x="316" y="240">choice and undoes it on reply</text>
      <line class="ln p" x1="550" y1="150" x2="708" y2="150" marker-end="url(#mp)"/>
      <text class="p" x="628" y="140" text-anchor="middle">dst 10.244.2.7:8080</text>
      <line class="ln dash" x1="550" y1="120" x2="708" y2="66" marker-end="url(#m)"/>
      <line class="ln dash" x1="550" y1="180" x2="708" y2="234" marker-end="url(#m)"/>
      <rect class="pod" x="710" y="36" width="160" height="56" rx="4"/>
      <text class="b" x="790" y="60" text-anchor="middle">api-1</text><text x="790" y="78" text-anchor="middle">10.244.1.6</text>
      <rect class="hot" x="710" y="122" width="160" height="56" rx="4"/>
      <text class="b" x="790" y="146" text-anchor="middle">api-2</text><text x="790" y="164" text-anchor="middle">10.244.2.7</text>
      <rect class="pod" x="710" y="208" width="160" height="56" rx="4"/>
      <text class="b" x="790" y="232" text-anchor="middle">api-3</text><text x="790" y="250" text-anchor="middle">10.244.2.8</text>
    </svg>
