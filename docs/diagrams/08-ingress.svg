<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 904 314" width="904" height="314" role="img" aria-label="A request for shop.local/api reaches the ingress controller pod, which matches host and path and forwards to an api pod instead of a web pod.">
<style>
  :root{--panel:#ffffff;--fg:#152033;--muted:#5b6b82;--line:#b9c4d4;--node:#e6ecf5;--pod:#dbe7ff;--pod-line:#6f93e0;--accent:#2a56c6;--pkt:#c2570c;--pkt-fill:#fdebd8}
  @media (prefers-color-scheme: dark){:root{--panel:#161e29;--fg:#e3e9f2;--muted:#93a1b5;--line:#3a4759;--node:#1a2431;--pod:#1c2f57;--pod-line:#5c82d6;--accent:#86a9ff;--pkt:#f0a253;--pkt-fill:#3a2714}}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:var(--fg)}
  .b{font-weight:600} text.dim{fill:var(--muted)} text.p{fill:var(--pkt);font-weight:600} text.a{fill:var(--accent);font-weight:600}
  .bg{fill:var(--panel)} .node{fill:var(--node);stroke:var(--line)} .pod{fill:var(--pod);stroke:var(--pod-line)}
  .box{fill:var(--panel);stroke:var(--line)} .hot{fill:var(--pkt-fill);stroke:var(--pkt);stroke-width:1.5}
  .ln{fill:none;stroke:var(--muted);stroke-width:1.5} .ln.a{stroke:var(--accent);stroke-width:2}
  .ln.p{stroke:var(--pkt);stroke-width:2} .ln.dash{stroke-dasharray:5 4}
  .mk{fill:var(--muted)} .mk.a{fill:var(--accent)} .mk.p{fill:var(--pkt)}
</style>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk a" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk p" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="-12" y="-12" width="904" height="314" rx="6"/>
      <rect class="box" x="10" y="110" width="130" height="60" rx="4"/>
      <text class="b" x="75" y="145" text-anchor="middle">browser</text>
      <line class="ln p" x1="140" y1="140" x2="328" y2="140" marker-end="url(#mp)"/>
      <text class="p" x="234" y="130" text-anchor="middle">GET /api</text>
      <text class="p" x="234" y="160" text-anchor="middle">Host: shop.local</text>
      <text class="dim" x="234" y="182" text-anchor="middle">via LB IP or NodePort</text>
      <rect class="node" x="330" y="30" width="250" height="230" rx="6"/>
      <text class="b" x="346" y="56">ingress controller pod</text>
      <text class="dim" x="346" y="74">a proxy: Traefik, Envoy…</text>
      <text x="346" y="116">Host shop.local</text>
      <text x="346" y="140">  /     → svc web</text>
      <text class="p" x="346" y="164">  /api  → svc api</text>
      <text class="dim" x="346" y="216">opens its own connection</text>
      <text class="dim" x="346" y="234">to a pod IP</text>
      <line class="ln dash" x1="580" y1="110" x2="678" y2="76" marker-end="url(#m)"/>
      <line class="ln p" x1="580" y1="170" x2="678" y2="210" marker-end="url(#mp)"/>
      <rect class="pod" x="680" y="40" width="190" height="56" rx="4"/>
      <text class="b" x="775" y="64" text-anchor="middle">web pods</text><text x="775" y="82" text-anchor="middle">10.244.1.8:80</text>
      <rect class="hot" x="680" y="190" width="190" height="56" rx="4"/>
      <text class="b" x="775" y="214" text-anchor="middle">api pods</text><text x="775" y="232" text-anchor="middle">10.244.2.7:8080</text>
    </svg>
