<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 904 324" width="904" height="324" role="img" aria-label="A pod's containers share one network namespace; its eth0 is one end of a veth pair whose other end sits in the node, where a route points at it.">
<style>
  :root{--panel:#ffffff;--fg:#152033;--muted:#5b6b82;--line:#b9c4d4;--node:#e6ecf5;--pod:#dbe7ff;--pod-line:#6f93e0;--accent:#2a56c6;--pkt:#c2570c;--pkt-fill:#fdebd8}
  @media (prefers-color-scheme: dark){:root{--panel:#161e29;--fg:#e3e9f2;--muted:#93a1b5;--line:#3a4759;--node:#1a2431;--pod:#1c2f57;--pod-line:#5c82d6;--accent:#86a9ff;--pkt:#f0a253;--pkt-fill:#3a2714}}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:var(--fg)}
  .b{font-weight:600} text.dim{fill:var(--muted)} text.p{fill:var(--pkt);font-weight:600} text.a{fill:var(--accent);font-weight:600}
  .bg{fill:var(--panel)} .node{fill:var(--node);stroke:var(--line)} .pod{fill:var(--pod);stroke:var(--pod-line)}
  .box{fill:var(--panel);stroke:var(--line)} .hot{fill:var(--pkt-fill);stroke:var(--pkt);stroke-width:1.5}
  .ln{fill:none;stroke:var(--muted);stroke-width:1.5} .ln.a{stroke:var(--accent);stroke-width:2}
  .ln.p{stroke:var(--pkt);stroke-width:2} .ln.dash{stroke-dasharray:5 4}
  .mk{fill:var(--muted)} .mk.a{fill:var(--accent)} .mk.p{fill:var(--pkt)}
</style>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk a" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk p" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="-12" y="-12" width="904" height="324" rx="6"/>
      <rect class="node" x="10" y="10" width="860" height="280" rx="6"/>
      <text class="b" x="26" y="34">worker1 · node (root) network namespace</text>
      <rect class="pod" x="40" y="60" width="400" height="200" rx="6"/>
      <text class="b" x="56" y="84">pod web · its own network namespace</text>
      <rect class="box" x="60" y="104" width="160" height="56" rx="4"/>
      <text class="b" x="74" y="128">nginx</text><text class="dim" x="74" y="146">listens on :80</text>
      <rect class="box" x="260" y="104" width="160" height="56" rx="4"/>
      <text class="b" x="274" y="128">log-sidecar</text><text class="dim" x="274" y="146">curl localhost:80</text>
      <line class="ln a" x1="260" y1="132" x2="222" y2="132" marker-end="url(#ma)"/>
      <text class="a" x="240" y="182" text-anchor="middle">localhost (shared)</text>
      <rect class="hot" x="170" y="206" width="140" height="36" rx="4"/>
      <text x="240" y="229" text-anchor="middle">eth0 10.244.1.5</text>
      <line class="ln p" x1="310" y1="224" x2="558" y2="224" marker-end="url(#mp)" marker-start="url(#mp)"/>
      <text class="p" x="500" y="216" text-anchor="middle">veth pair</text>
      <rect class="hot" x="560" y="206" width="150" height="36" rx="4"/>
      <text x="635" y="229" text-anchor="middle">veth1a2b (node)</text>
      <rect class="box" x="500" y="60" width="340" height="96" rx="4"/>
      <text class="b" x="516" y="84">node routing table</text>
      <text x="516" y="110">10.244.1.5 dev veth1a2b</text>
      <text class="dim" x="516" y="132">10.244.2.0/24 via 172.18.0.4</text>
      <line class="ln p" x1="635" y1="206" x2="635" y2="158" marker-end="url(#mp)"/>
    </svg>
