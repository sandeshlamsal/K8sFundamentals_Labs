<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 904 304" width="904" height="304" role="img" aria-label="Pod A asks CoreDNS for the api Service name, gets back the ClusterIP, then connects to that IP itself.">
<style>
  :root{--panel:#ffffff;--fg:#152033;--muted:#5b6b82;--line:#b9c4d4;--node:#e6ecf5;--pod:#dbe7ff;--pod-line:#6f93e0;--accent:#2a56c6;--pkt:#c2570c;--pkt-fill:#fdebd8}
  @media (prefers-color-scheme: dark){:root{--panel:#161e29;--fg:#e3e9f2;--muted:#93a1b5;--line:#3a4759;--node:#1a2431;--pod:#1c2f57;--pod-line:#5c82d6;--accent:#86a9ff;--pkt:#f0a253;--pkt-fill:#3a2714}}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:var(--fg)}
  .b{font-weight:600} text.dim{fill:var(--muted)} text.p{fill:var(--pkt);font-weight:600} text.a{fill:var(--accent);font-weight:600}
  .bg{fill:var(--panel)} .node{fill:var(--node);stroke:var(--line)} .pod{fill:var(--pod);stroke:var(--pod-line)}
  .box{fill:var(--panel);stroke:var(--line)} .hot{fill:var(--pkt-fill);stroke:var(--pkt);stroke-width:1.5}
  .ln{fill:none;stroke:var(--muted);stroke-width:1.5} .ln.a{stroke:var(--accent);stroke-width:2}
  .ln.p{stroke:var(--pkt);stroke-width:2} .ln.dash{stroke-dasharray:5 4}
  .mk{fill:var(--muted)} .mk.a{fill:var(--accent)} .mk.p{fill:var(--pkt)}
</style>
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk a" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk p" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="-12" y="-12" width="904" height="304" rx="6"/>
      <rect class="pod" x="10" y="20" width="270" height="140" rx="4"/>
      <text class="b" x="24" y="44">pod A · /etc/resolv.conf</text>
      <text x="24" y="72">nameserver 10.96.0.10</text>
      <text x="24" y="94">search default.svc.cluster.local</text>
      <text x="24" y="112">       svc.cluster.local</text>
      <text x="24" y="130">       cluster.local</text>
      <text x="24" y="150">options ndots:5</text>
      <rect class="node" x="600" y="20" width="270" height="140" rx="6"/>
      <text class="b" x="616" y="44">CoreDNS pods</text>
      <text x="616" y="72">Service kube-dns</text>
      <text x="616" y="92">10.96.0.10:53</text>
      <text class="dim" x="616" y="126">watches Services through</text>
      <text class="dim" x="616" y="144">the API server</text>
      <line class="ln p" x1="280" y1="64" x2="598" y2="64" marker-end="url(#mp)"/>
      <text class="p" x="440" y="54" text-anchor="middle">1 api.default.svc.cluster.local ?</text>
      <line class="ln a" x1="600" y1="124" x2="282" y2="124" marker-end="url(#ma)"/>
      <text class="a" x="440" y="114" text-anchor="middle">2 A 10.96.0.50</text>
      <line class="ln p" x1="145" y1="160" x2="145" y2="218" marker-end="url(#mp)"/>
      <text class="p" x="160" y="194">3 connect to 10.96.0.50:80</text>
      <rect class="box" x="10" y="220" width="270" height="44" rx="4"/>
      <text x="145" y="247" text-anchor="middle">Service api 10.96.0.50</text>
      <text class="dim" x="300" y="247">then the rewrite from the previous diagram</text>
    </svg>
